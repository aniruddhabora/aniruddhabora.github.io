  <path d="M195 240 C195 165, 300 165, 300 240 C300 315, 405 315, 405 240 C405 165, 300 165, 300 240 C300 315, 195 315, 195 240Z" fill="none" stroke="url(#gc)" stroke-width="3" opacity="0.7" class="sparks-loop" pathLength="1000" />

  
  <path d="M200 240 C200 172, 300 172, 300 240 C300 308, 400 308, 400 240 C400 172, 300 172, 300 240 C300 308, 200 308, 200 240Z" fill="none" stroke="url(#ga)" stroke-width="2" opacity="0.2" />

  
  <path d="M190 240 C190 158, 300 158, 300 240 C300 322, 410 322, 410 240 C410 158, 300 158, 300 240 C300 322, 190 322, 190 240Z" fill="none" stroke="url(#gb)" stroke-width="1.5" opacity="0.12" />

  
  
