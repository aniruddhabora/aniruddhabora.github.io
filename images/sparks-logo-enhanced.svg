  <text x="170" y="268" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#F59E0B" font-weight="600" letter-spacing="2" opacity=".8">AI</text>
  <text x="430" y="268" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#06B6D4" font-weight="600" letter-spacing="2" opacity=".8">SCI</text>

  
  <text x="300" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="8" fill="url(#gd)" class="sparks-wordmark">SPARKS</text>

  
  <path d="M195 240 C195 165, 300 165, 300 240 C300 315, 405 315, 405 240 C405 165, 300 165, 300 240 C300 315, 195 315, 195 240Z" class="sparks-trail" pathLength="1000" fill="none" stroke="url(#gc)" stroke-width="4" stroke-linecap="round" opacity="0" /><circle cx="300" cy="240" r="35" class="sparks-ripple" fill="none" stroke="#82e3d7" stroke-width="1" opacity="0" /><g class="sparks-incoming warm" opacity="0"><circle cx="300" cy="240" r="9" fill="#f4b35d" filter="url(#gls)" /><circle cx="300" cy="240" r="3" fill="#ffffff" /></g><g class="sparks-incoming cool" opacity="0"><circle cx="300" cy="240" r="9" fill="#82e3d7" filter="url(#gls)" /><circle cx="300" cy="240" r="3" fill="#ffffff" /></g></svg>