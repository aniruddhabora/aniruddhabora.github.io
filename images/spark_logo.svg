<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="50%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="gd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="50%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gls"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glxl"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Subtle background glow -->
  <circle cx="300" cy="240" r="100" fill="#F59E0B" filter="url(#glxl)" opacity="0.04"/>
  <circle cx="300" cy="240" r="100" fill="#06B6D4" filter="url(#glxl)" opacity="0.03"/>

  <!-- Infinity / S-curve (AI ↔ Science loop) - main stroke -->
  <path d="M195 240 C195 165, 300 165, 300 240 C300 315, 405 315, 405 240 C405 165, 300 165, 300 240 C300 315, 195 315, 195 240Z" 
        fill="none" stroke="url(#gc)" stroke-width="4" opacity="0.7"/>

  <!-- Second offset curve for depth -->
  <path d="M200 240 C200 172, 300 172, 300 240 C300 308, 400 308, 400 240 C400 172, 300 172, 300 240 C300 308, 200 308, 200 240Z" 
        fill="none" stroke="url(#ga)" stroke-width="2" opacity="0.2"/>

  <!-- Third curve for richness -->
  <path d="M190 240 C190 158, 300 158, 300 240 C300 322, 410 322, 410 240 C410 158, 300 158, 300 240 C300 322, 190 322, 190 240Z" 
        fill="none" stroke="url(#gb)" stroke-width="1.5" opacity="0.12"/>

  <!-- Main nodes at the 3 key positions -->
  <!-- Left node (AI) -->
  <circle cx="195" cy="240" r="14" fill="url(#ga)" filter="url(#gls)"/>
  <circle cx="195" cy="240" r="6" fill="#fff" opacity="0.9"/>
  
  <!-- Right node (Science) -->
  <circle cx="405" cy="240" r="14" fill="url(#gb)" filter="url(#gls)"/>
  <circle cx="405" cy="240" r="6" fill="#fff" opacity="0.9"/>
  
  <!-- Center node (Convergence) -->
  <circle cx="300" cy="240" r="17" fill="url(#gc)" filter="url(#gls)"/>
  <circle cx="300" cy="240" r="7.5" fill="#fff" opacity="0.92"/>

  <!-- Intermediate nodes on the curves -->
  <circle cx="240" cy="185" r="7" fill="#F59E0B" filter="url(#gl)" opacity="0.75"/>
  <circle cx="360" cy="185" r="7" fill="#06B6D4" filter="url(#gl)" opacity="0.75"/>
  <circle cx="240" cy="295" r="7" fill="#06B6D4" filter="url(#gl)" opacity="0.75"/>
  <circle cx="360" cy="295" r="7" fill="#F59E0B" filter="url(#gl)" opacity="0.75"/>

  <!-- Inner connecting lines forming a network -->
  <line x1="240" y1="185" x2="300" y2="240" stroke="#F59E0B" stroke-width="1.3" opacity="0.2"/>
  <line x1="360" y1="185" x2="300" y2="240" stroke="#06B6D4" stroke-width="1.3" opacity="0.2"/>
  <line x1="240" y1="295" x2="300" y2="240" stroke="#06B6D4" stroke-width="1.3" opacity="0.2"/>
  <line x1="360" y1="295" x2="300" y2="240" stroke="#F59E0B" stroke-width="1.3" opacity="0.2"/>
  <line x1="240" y1="185" x2="360" y2="185" stroke="url(#gc)" stroke-width="1" opacity="0.12"/>
  <line x1="240" y1="295" x2="360" y2="295" stroke="url(#gc)" stroke-width="1" opacity="0.12"/>

  <!-- Floating spark particles -->
  <circle cx="165" cy="195" r="3" fill="#F59E0B" filter="url(#gl)" opacity="0.5"/>
  <circle cx="435" cy="195" r="3" fill="#06B6D4" filter="url(#gl)" opacity="0.5"/>
  <circle cx="165" cy="285" r="2.5" fill="#06B6D4" filter="url(#gl)" opacity="0.4"/>
  <circle cx="435" cy="285" r="2.5" fill="#F59E0B" filter="url(#gl)" opacity="0.4"/>
  <circle cx="300" cy="155" r="2.5" fill="#EF4444" filter="url(#gl)" opacity="0.4"/>
  <circle cx="300" cy="325" r="2.5" fill="#3B82F6" filter="url(#gl)" opacity="0.4"/>

  <!-- Subtle labels near left and right nodes -->
  <text x="170" y="268" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#F59E0B" font-weight="600" letter-spacing="2" opacity="0.45">AI</text>
  <text x="430" y="268" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#06B6D4" font-weight="600" letter-spacing="2" opacity="0.45">SCI</text>

  <!-- SPARK text -->
  <text x="300" y="420" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',sans-serif" font-size="52" font-weight="800" letter-spacing="10" fill="url(#gd)">SPARK</text>

  <!-- Full form -->
  <text x="300" y="455" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',sans-serif" font-size="12" fill="#64748B" letter-spacing="3" font-weight="300">SCIENTIFIC PREDICTION THROUGH AI RESEARCH &amp; KNOWLEDGE</text>

  <!-- Subtle divider -->
  <line x1="220" y1="475" x2="380" y2="475" stroke="url(#gc)" stroke-width="1" opacity="0.15"/>

  <!-- University -->
  <text x="300" y="500" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',sans-serif" font-size="11" fill="#475569" letter-spacing="4" font-weight="300">TEXAS STATE UNIVERSITY</text>

  <!-- Dr. Bora -->
  <text x="300" y="530" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',sans-serif" font-size="12" fill="#64748B" letter-spacing="2" font-weight="400">Dr. Aniruddha Bora</text>
</svg>
