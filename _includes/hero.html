<!-- Animated hero banner (self-contained). Decorative; safe to remove. -->
<div class="hero-banner" aria-hidden="true">
  <svg viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#eef0ff"/>
        <stop offset="55%" stop-color="#e6e9ff"/>
        <stop offset="100%" stop-color="#dfe3ff"/>
      </linearGradient>
      <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#4338ca"/>
      </linearGradient>
    </defs>

    <rect x="0" y="0" width="1200" height="240" fill="url(#heroBg)"/>

    <!-- neural-operator node graph -->
    <g class="hero-net" stroke="#4f46e5" stroke-opacity="0.28" stroke-width="1.2" fill="#4f46e5">
      <line x1="120" y1="60" x2="300" y2="40"/>
      <line x1="300" y1="40" x2="500" y2="78"/>
      <line x1="500" y1="78" x2="720" y2="44"/>
      <line x1="720" y1="44" x2="940" y2="70"/>
      <line x1="940" y1="70" x2="1080" y2="46"/>
      <line x1="300" y1="40" x2="500" y2="30"/>
      <line x1="500" y1="78" x2="720" y2="92"/>
      <circle class="n n1" cx="120"  cy="60" r="4"/>
      <circle class="n n2" cx="300"  cy="40" r="5"/>
      <circle class="n n3" cx="500"  cy="78" r="4"/>
      <circle class="n n4" cx="720"  cy="44" r="5"/>
      <circle class="n n5" cx="940"  cy="70" r="4"/>
      <circle class="n n6" cx="1080" cy="46" r="5"/>
    </g>

    <!-- flowing PDE-style waves -->
    <g fill="none" stroke="url(#waveGrad)" stroke-linecap="round">
      <path class="wave wave3" d="M -800,132 q 100.0,-22 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0" stroke-width="2"   stroke-opacity="0.22"/>
      <path class="wave wave2" d="M -800,168 q 100.0,-30 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0" stroke-width="2.5" stroke-opacity="0.35"/>
      <path class="wave wave1" d="M -800,150 q 100.0,-46 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0 t 200,0" stroke-width="3"   stroke-opacity="0.55"/>
    </g>
  </svg>

  <div class="hero-caption">
    <span>Scientific Machine Learning</span>
    <span class="dot">&middot;</span>
    <span>Physics-Informed AI</span>
    <span class="dot">&middot;</span>
    <span>Operator Learning</span>
  </div>
</div>

<style>
.hero-banner {
  position: relative;
  width: 100%;
  border-radius: 14px;
  overflow: hidden;
  margin: 0 0 1.6em;
  box-shadow: 0 10px 30px rgba(79,70,229,0.14);
  line-height: 0;
}
.hero-banner svg { width: 100%; height: auto; display: block; }
.hero-caption {
  position: absolute;
  left: 0; right: 0; bottom: 14px;
  text-align: center;
  line-height: 1.2;
  font-family: "Newsreader", Georgia, serif;
  font-size: clamp(0.8rem, 2.4vw, 1.05rem);
  letter-spacing: 0.04em;
  color: #3730a3;
}
.hero-caption .dot { opacity: 0.5; margin: 0 0.4em; }
html[data-theme="dark"] .hero-banner { box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
html[data-theme="dark"] .hero-caption { color: #c7d2fe; }

/* motion only when the visitor hasn't asked to reduce it */
@media (prefers-reduced-motion: no-preference) {
  .wave { animation: heroDrift 14s linear infinite; }
  .wave2 { animation-duration: 20s; }
  .wave3 { animation-duration: 27s; }
  @keyframes heroDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }
  .hero-net .n { animation: heroPulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .n2 { animation-delay: 0.6s; } .n3 { animation-delay: 1.2s; }
  .n4 { animation-delay: 1.8s; } .n5 { animation-delay: 2.4s; } .n6 { animation-delay: 3s; }
  @keyframes heroPulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.5); }
  }
}
</style>
